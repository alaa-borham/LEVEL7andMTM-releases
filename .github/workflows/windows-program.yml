name: windows-program

# The full Windows program of every release the admin approves (LEVEL7 CAD MTM Admin → التحديثات → اعتماد writes
# latest.json): checked against the admin's signed approval, built, tried on a real Windows machine (it starts; one
# changed byte in its sealed core and it refuses to start), then put on this repository's Releases page — one fixed
# address to download it: https://github.com/alaa-borham/LEVEL7andMTM-releases/releases/latest
on:
  push:
    branches: [main]
    paths:
      - 'level7-cad/releases/latest.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty: the one offered to the computers now)'
        required: false

permissions:
  contents: write

concurrency:
  group: windows-program
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          WANTED: ${{ github.event.inputs.version }}
        run: |
          V="$WANTED"; [ -n "$V" ] || V=$(node -p "require('./level7-cad/releases/latest.json').version")
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version $V"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - run: node tools/verify-release.mjs ${{ steps.v.outputs.v }}
      - run: bash tools/build-windows.sh ${{ steps.v.outputs.v }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: dist/LEVEL7-and-MTM-${{ steps.v.outputs.v }}-win32-x64.zip
          retention-days: 1

  check:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: program
      - name: unpack
        shell: pwsh
        run: Expand-Archive -Path LEVEL7-and-MTM-${{ needs.build.outputs.v }}-win32-x64.zip -DestinationPath w
      - name: the sealed program starts
        shell: pwsh
        run: |
          $d = "w/LEVEL7-and-MTM-${{ needs.build.outputs.v }}-win32-x64"
          $p = Start-Process -FilePath "$d/LEVEL7 and MTM.exe" -ArgumentList "--l7-smoke=$PWD\smoke1.json" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "did not finish" }
          Get-Content smoke1.json
          $j = Get-Content smoke1.json | ConvertFrom-Json
          if (-not $j.ok -or -not $j.sealed -or $j.version -ne "${{ needs.build.outputs.v }}") { throw "not started sealed" }
      - name: the command line for LEVEL7 MTM works (0.9.304+) and keeps the admin's control
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.v }}"
          if ([version]$v -lt [version]"0.9.304") { "no command line before 0.9.304"; exit 0 }
          $d = "w/LEVEL7-and-MTM-$v-win32-x64"
          $p = Start-Process -FilePath "$d/LEVEL7 and MTM.exe" -ArgumentList "--cli","--self-test","--out","$PWD\st" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test did not finish" }
          Get-Content st/level7-selftest.json
          $j = Get-Content st/level7-selftest.json | ConvertFrom-Json
          if (-not $j.ok -or -not $j.sealed -or $p.ExitCode -ne 0) { throw "the command line does not work in the sealed program" }
          '{"version":1,"name":"t","measurements":[{"id":1,"name":"w","value":100}],"variables":[],"steps":[],"names":{},"nextId":1,"pieces":[]}' | Set-Content m.level7
          '{"customer":"c","order":"1","measurements":{"X1":120}}' | Set-Content o.json
          $p = Start-Process -FilePath "$d/LEVEL7 and MTM.exe" -ArgumentList "--cli","--model","$PWD\m.level7","--order","$PWD\o.json","--out","$PWD\co" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "did not finish" }
          Get-Content co/level7-report.json
          $r = Get-Content co/level7-report.json | ConvertFrom-Json
          if ($p.ExitCode -ne 4 -or $r.licence -ne $false) { throw "an order was made with no user signed in" }
          "refused with no user (exit 4, $($r.reason))"
      # 0.9.306: the full program as an installer (it is what the programs install themselves when a release changes the
      # sealed core): built here from the program just checked, installed silently, the installed program starts sealed
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: the installer (Setup) - built, installed silently, the installed program starts sealed
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.v }}"
          $d = "$PWD\w\LEVEL7-and-MTM-$v-win32-x64"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$d" "/O$PWD\setup" repo\tools\installer-cad.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          $s = "setup\LEVEL7-and-MTM-$v-Setup.exe"
          $p = Start-Process -FilePath $s -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$PWD\inst" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer failed ($($p.ExitCode))" }
          if (!(Test-Path "$env:USERPROFILE\Desktop\LEVEL7 and MTM.lnk") -and !(Test-Path "$env:PUBLIC\Desktop\LEVEL7 and MTM.lnk")) { "note: no desktop shortcut found" }
          $p = Start-Process -FilePath "$PWD\inst\LEVEL7 and MTM.exe" -ArgumentList "--l7-smoke=$PWD\smoke3.json" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the installed program did not finish" }
          Get-Content smoke3.json
          $j = Get-Content smoke3.json | ConvertFrom-Json
          if (-not $j.ok -or -not $j.sealed -or $j.version -ne $v) { throw "the installed program did not start sealed" }
          (Get-Item $s).Length
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: setup/LEVEL7-and-MTM-${{ needs.build.outputs.v }}-Setup.exe
          retention-days: 1
      - name: one byte changed in the sealed core - it must not start
        shell: pwsh
        run: |
          $d = "w/LEVEL7-and-MTM-${{ needs.build.outputs.v }}-win32-x64"
          $f = "$d/resources/app.asar"
          $b = [System.IO.File]::ReadAllBytes($f); $i = $b.Length - 200; $b[$i] = $b[$i] -bxor 1; [System.IO.File]::WriteAllBytes($f, $b)
          $p = Start-Process -FilePath "$d/LEVEL7 and MTM.exe" -ArgumentList "--l7-smoke=$PWD\smoke2.json" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill() }
          if (Test-Path smoke2.json) { Get-Content smoke2.json; throw "the changed program started" }
          "refused to start (exit $($p.ExitCode))"

  publish:
    needs: [build, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: program
      - uses: actions/download-artifact@v4
        with:
          name: setup
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.v }}
        run: |
          NOTES=$(node -p "require('./level7-cad/releases/manifests/$V.json').notes || ''")
          BODY=$(printf 'LEVEL7 and MTM %s — Windows (64-bit)\n\n%s\n\nالتثبيت: شغّل «LEVEL7-and-MTM-%s-Setup.exe» (لا يحتاج صلاحيات المدير، ويضع اختصاراً على سطح المكتب). بعد ذلك تصل الإصدارات المعتمدة وحدها، حتى التي تحتاج البرنامج الكامل.\nأو الملف المضغوط: فكّه، ثم افتح «LEVEL7 - first run.cmd» أول مرة فقط.\nيعمل فقط باسم مستخدم وكلمة سر من المدير، وعلى جهاز يوافق عليه.' "$V" "$NOTES" "$V")
          SETUP="LEVEL7-and-MTM-$V-Setup.exe"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "LEVEL7-and-MTM-$V-win32-x64.zip" "$SETUP" --clobber
          else
            gh release create "v$V" "$SETUP" "LEVEL7-and-MTM-$V-win32-x64.zip" --title "LEVEL7 and MTM $V" --notes "$BODY" --latest
          fi
          # 0.9.306: the installer's fingerprint where the programs read it (they install it themselves when it is needed)
          SHA=$(sha256sum "$SETUP" | cut -d' ' -f1); SIZE=$(stat -c %s "$SETUP")
          mkdir -p level7-cad/releases/setups
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/v%s/%s","sha256":"%s","size":%s}\n' "$V" "$GITHUB_REPOSITORY" "$V" "$SETUP" "$SHA" "$SIZE" > "level7-cad/releases/setups/$V.json"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "level7-cad/releases/setups/$V.json"
          git commit -m "LEVEL7 and MTM $V: its installer's fingerprint"
          # (the loop's own result was 0 even when no push went through: the fingerprint was then missing, the job green,
          # and the programs waited at «يُحضَّر على GitHub» for ever — now the job fails and says so)
          pushed=0
          for i in 1 2 3 4; do if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi; sleep 5; done
          if [ "$pushed" != "1" ]; then echo "::error::the installer's fingerprint (level7-cad/releases/setups/$V.json) could not be pushed: run this workflow again"; exit 1; fi
